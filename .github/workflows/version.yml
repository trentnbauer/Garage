name: Create Version and Docker Container

# When a pull request is merged into main, its "release:" label decides the next version:
#   release: fix    1.2.3 -> 1.2.4      release: minor  1.2.3 -> 1.3.0
#   release: major  1.2.3 -> 2.0.0      release: none   no release
# This workflow creates the tag and a GitHub release, then publishes the Docker image.
# The rules live in .github/scripts/next-version.sh. See README, "Versions and releases".
on:
  push:
    branches: [main]

permissions:
  contents: read

# One at a time, in order, so two quick merges never pick the same number.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: |
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then echo "No pull request for this commit: no release."; exit 0; fi
          labels="$(gh pr view "$pr" --json labels --jq '[.labels[].name] | join(",")')"
          echo "Pull request #$pr, labels: $labels"
          version="$(git tag --list 'v*' | .github/scripts/next-version.sh "$labels")"
          if [ -z "$version" ]; then echo "Labelled release: none, so no release."; exit 0; fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "v$version already exists."; exit 1; fi
          git tag "v$version" "$GITHUB_SHA"
          git push origin "v$version"
          gh release create "v$version" --verify-tag --title "v$version" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"

  docker:
    needs: tag
    if: needs.tag.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.tag.outputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/garage
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.tag.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.tag.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.tag.outputs.version }}
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
